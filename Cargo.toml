[package]
name = "ollama-gui"
version = "2.0.0"
edition = "2024"
description = "Manage your Ollama models: pull, update, load, customize and chat."
license = "MIT"
repository = "https://github.com/Hugo291/ollama-gui"
publish = false

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
directories = "6.0.0"
futures-util = "0.3.34"
open = "5.4.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
slint = { version = "1.18", features = ["unstable-winit-030"] }
sys-locale = "0.3.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
