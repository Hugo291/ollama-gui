name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: scripts/test.sh
      - name: Build app
        run: scripts/build-app.sh
      - name: Smoke test
        # The app must still be running a few seconds after launch (no Ollama on the runner).
        run: |
          "dist/Ollama GUI.app/Contents/MacOS/OllamaGUI" &
          pid=$!
          sleep 10
          kill -0 "$pid"
          kill "$pid"
      - uses: actions/upload-artifact@v7
        with:
          name: OllamaGUI-macOS
          path: dist/OllamaGUI-macOS.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/OllamaGUI-macOS.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/OllamaGUI-macOS.zip --title "Ollama GUI ${GITHUB_REF_NAME#v}" --generate-notes
          fi
